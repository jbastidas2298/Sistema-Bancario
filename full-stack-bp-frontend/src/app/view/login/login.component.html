<div class="login-container">
  <div class="title-container">
    <h2 class="faculty-title">Sistema Bancario</h2>
  </div>

  <div class="login-card">
    <div class="card-header">
      <h3>Iniciar Sesión</h3>
    </div>

    <div class="card-content">
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" formControlName="username" class="form-input"
            placeholder="Ingrese su usuario" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-container">
            <input [type]="hide ? 'password' : 'text'" id="password" formControlName="password" class="form-input"
              placeholder="Ingrese su contraseña" required>
            <button type="button" class="password-toggle" (click)="hide = !hide">
              <span class="eye-icon" [class.hide]="!hide"></span>
            </button>
          </div>
        </div>

        <div class="button-container">
          <button type="submit" class="login-button" [disabled]="loginForm.invalid">
            Iniciar Sesión
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
