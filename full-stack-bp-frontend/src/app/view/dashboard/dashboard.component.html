<div class="dashboard-container">
  <div class="sidebar">
    <div class="sidebar-header">
      <h3>Sistema Bancario</h3>
    </div>
    
    <div class="nav-links">
      <a routerLink="/clients" routerLinkActive="active">Clientes</a>
      <a routerLink="/accounts" routerLinkActive="active">Cuentas</a>
      <a routerLink="/transactions" routerLinkActive="active">Transacciones</a>
      <a routerLink="/reports" routerLinkActive="active">Reportes</a>
    </div>
    
    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        Cerrar Sesión
      </button>
    </div>
  </div>

  <div class="main-content">
    <div class="header">
      <span>Sistema de Gestión de Información Bancaria</span>
      <div class="user-info">
        <span>{{currentUser}}</span>
      </div>
    </div>

    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
